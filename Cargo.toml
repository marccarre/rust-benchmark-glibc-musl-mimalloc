[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marccarre/rust-benchmark-glibc-musl-mimalloc"
authors = ["Marc Carré"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hdrhistogram = "7.5"
libc = "0.2"
rand = { version = "0.8", features = ["small_rng"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
anyhow = "1"
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
mimalloc = { version = "0.1", default-features = false, features = ["extended"] }
libmimalloc-sys = { version = "0.1", features = ["extended"] }
num_cpus = "1.16"
crossbeam-channel = "0.5"
axum = { version = "0.8", default-features = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tower = { version = "0.5" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rayon = { version = "1" }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
debug = false
panic = "abort"
overflow-checks = false

[profile.bench-debug]
inherits = "release"
strip = "none"
debug = "full"
lto = "thin"
