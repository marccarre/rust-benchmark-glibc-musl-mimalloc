[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marccarre/rust-benchmark-glibc-musl-mimalloc"
authors = ["Marc Carré"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hdrhistogram = "7.5"
libc = "0.2"
rand = { version = "0.8", features = ["small_rng"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
anyhow = "1"
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
mimalloc = { version = "0.1", default-features = false, features = ["extended"] }
libmimalloc-sys = { version = "0.1", features = ["extended"] }
num_cpus = "1.16"
crossbeam-channel = "0.5"
axum = { version = "0.8", default-features = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tower = { version = "0.5" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rayon = { version = "1" }
tinytemplate = "1"
# glob: rust-lang-owner; flagged [SUS] by slopcheck as a name-similarity false positive vs `log` (RESEARCH §Package Legitimacy Audit) — false positive; canonical glob crate.
glob = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
debug = false
# CR-01 (Phase-2 review): keep `panic = "unwind"` (the toolchain default).
# `run-all` (alloc-bench-cli) uses `std::panic::catch_unwind` to record a
# `status: "failed"` Run record per scenario rather than aborting the
# whole process when a single scenario panics. Setting `panic = "abort"`
# silently disables `catch_unwind` in release — the documented per-scenario
# isolation contract from CONTEXT.md / RESEARCH.md would not hold and the
# release binary would diverge from `cargo test`'s dev profile (which uses
# unwind). Cost is a marginally larger binary and slightly slower panic
# codegen — both negligible for a benchmark tool whose hot paths never
# panic. Do NOT re-enable `panic = "abort"` without redesigning run-all.
overflow-checks = false

[profile.bench-debug]
inherits = "release"
strip = "none"
debug = "full"
lto = "thin"
