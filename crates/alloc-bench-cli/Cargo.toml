[package]
name = "alloc-bench-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "alloc-bench-cli"
path = "src/main.rs"

[features]
default = []
alloc-jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
alloc-mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

[dependencies]
alloc-bench-core = { path = "../alloc-bench-core" }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }
libmimalloc-sys = { workspace = true, optional = true }


[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
